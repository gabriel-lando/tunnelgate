## Tunnelgate on the internal SWAG instance (*.int.<domain>).
## Requires the "tunnelgate" Docker network to be attached to SWAG.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tunnelgate.int.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 64k;

    # Optional defense in depth: Authelia forward auth in front of the app's own OIDC login.
    # The session is shared, so this costs no extra sign-in.
    #include /config/nginx/authelia-server.conf;

    location / {
        #include /config/nginx/authelia-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app tunnelgate;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Tunnelgate sets its own security headers; do not let caches keep API responses.
        proxy_hide_header X-Powered-By;
    }
}
