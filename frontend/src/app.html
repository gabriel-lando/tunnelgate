<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)" />
		<meta name="referrer" content="same-origin" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tunnelgate" />
		<script>
			try {
				var t = localStorage.getItem('tunnelgate.theme') || 'system';
				var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', d);
			} catch (e) {
				document.documentElement.classList.add('dark');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
