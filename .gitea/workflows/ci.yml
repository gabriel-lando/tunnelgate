name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    # Monthly rebuild picks up base image patches.
    - cron: '0 1 1 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPOSITORY: gabriellando/tunnelgate
  SOURCE_REPOSITORY: gabriel-lando/tunnelgate
  UV_VERSION: '0.13.3'
  PYTHON_VERSION: '3.15'
  NODE_VERSION: '24'
  GO_VERSION: '1.27.x'
  # Go scanners are verified by the Go checksum database; Python scanners by ci/scanners.txt hashes.
  GITLEAKS_VERSION: v8.30.1
  OSV_SCANNER_VERSION: v2.7.0
  CST_VERSION: v1.22.1

jobs:
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm i18n:check

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install scanners (hash-locked)
        run: |
          uv venv /tmp/scanners
          uv pip install --python /tmp/scanners/bin/python --require-hashes -r ci/scanners.txt
          echo "/tmp/scanners/bin" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint .gitea/workflows/*.yml
      - name: zizmor
        run: zizmor --offline --min-severity medium .gitea/workflows/*.yml

  security-scan:
    name: Secrets and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install scanners (hash-locked)
        run: |
          uv venv /tmp/scanners
          uv pip install --python /tmp/scanners/bin/python --require-hashes -r ci/scanners.txt
          echo "/tmp/scanners/bin" >> "$GITHUB_PATH"
      - name: Install Go scanners (Go checksum database verified)
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Gitleaks (full history)
        run: gitleaks git --redact --exit-code 1 .
      - name: OSV-Scanner (lockfiles)
        run: osv-scanner scan source --lockfile backend/uv.lock --lockfile frontend/pnpm-lock.yaml
      - name: pip-audit (runtime dependencies)
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          pip-audit --strict --require-hashes --disable-pip -r /tmp/requirements.txt
      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Bandit
        run: bandit -r backend/src -ll
      - name: Semgrep
        # semgrep-core overflows the default 8 MB stack (exits with -11).
        run: |
          ulimit -s 65536
          semgrep scan --metrics off --error --config p/python --config p/typescript --config p/secrets --config p/dockerfile backend/src frontend/src Dockerfile
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      # Unit + integration tests (Cloudflare API and OIDC provider are mocked); also checks the OpenAPI contract.
      - run: uv run pytest

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  image:
    name: Build and scan image
    needs: [lint-backend, lint-frontend, workflow-lint, security-scan, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: meta
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          publish=false
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="${REF#refs/tags/}"; publish=true
          elif [[ "$REF" == "refs/heads/main" ]]; then
            tag="latest"; publish=true
          else
            tag="ci"
          fi
          {
            echo "tag=$tag"
            echo "publish=$publish"
            echo "version=$tag"
            echo "commit=$SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load locally, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          pull: true
          provenance: false
          tags: tunnelgate:candidate
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Container Structure Test
        # go install refuses modules with exclude directives; build from the (checksum-verified) module cache.
        run: |
          dir="$(go mod download -json "github.com/GoogleContainerTools/container-structure-test@${CST_VERSION}" \
            | sed -n 's/^[[:space:]]*"Dir": "\(.*\)",$/\1/p')"
          (cd "$dir" && go build -trimpath -o /tmp/container-structure-test ./cmd/container-structure-test)
          /tmp/container-structure-test test --image tunnelgate:candidate --config container-structure-test.yaml
      - name: Smoke test
        # The job may itself run in a container (Gitea act_runner), so published ports are not reachable
        # on its loopback: checks run inside the smoke container's network namespace instead.
        run: |
          docker run -d --name tg-smoke \
            -e CF_API_TOKEN=dummy -e CF_ACCOUNT_ID=0123456789abcdef0123456789abcdef \
            -e OIDC_ISSUER=https://auth.example.com -e OIDC_CLIENT_ID=tunnelgate -e OIDC_CLIENT_SECRET=dummy \
            -e APP_URL=https://localhost -e ALLOWED_GROUPS=HomeAdmins \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            tunnelgate:candidate
          for _ in $(seq 1 30); do
            if docker exec tg-smoke python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)" 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec -i tg-smoke python - <<'EOF'
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          urllib.request.urlopen(f"{base}/healthz", timeout=5)
          try:
              urllib.request.urlopen(f"{base}/api/me", timeout=5)
              raise SystemExit("/api/me answered without a session")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"/api/me returned {exc.code}"
          headers = urllib.request.urlopen(f"{base}/", timeout=5).headers
          assert headers.get("content-security-policy"), "missing Content-Security-Policy"
          print("smoke test ok")
          EOF
      - name: OWASP ZAP baseline
        # -I: warnings do not fail the build; failures do.
        run: >-
          docker run --rm --network container:tg-smoke ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py -t http://127.0.0.1:8000 -I
      - name: Stop smoke container
        if: always()
        run: docker rm -f tg-smoke || true
      - name: SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: tunnelgate:candidate
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tunnelgate:candidate
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Export the scanned image
        if: steps.meta.outputs.publish == 'true'
        run: docker save tunnelgate:candidate -o image.tar && sha256sum image.tar sbom.spdx.json > checksums.txt
      - name: Hand the exact scanned image to the publish job
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanned-image
          path: |
            image.tar
            sbom.spdx.json
            checksums.txt
          retention-days: 1

  publish:
    name: Publish image
    needs: image
    # Only main and version tags ever reach the job that holds the release secrets.
    if: needs.image.outputs.publish == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: release
    env:
      DTRACK_ENABLED: ${{ secrets.DTRACK_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image
      - name: Load the scanned image
        run: |
          sha256sum -c checksums.txt
          docker load -i image.tar
      - name: Install envsubst
        run: |
          if ! command -v envsubst >/dev/null; then
            SUDO="$(command -v sudo || true)"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends gettext-base
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        id: push
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          docker tag tunnelgate:candidate "${DOCKERHUB_REPOSITORY}:${TAG}"
          docker push "${DOCKERHUB_REPOSITORY}:${TAG}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${DOCKERHUB_REPOSITORY}:${TAG}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign image and attach SBOM attestation
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Key-pair signing without the public transparency log; cosign 3 needs the legacy signing path for that.
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false "$DIGEST"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false \
            --type spdxjson --predicate sbom.spdx.json "$DIGEST"
      - name: Upload SBOM to Dependency-Track
        if: env.DTRACK_ENABLED == 'true'
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          curl -fsS -X POST "${DTRACK_URL%/}/api/v1/bom" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -F "autoCreate=true" -F "projectName=tunnelgate" -F "projectVersion=${TAG}" \
            -F "bom=@sbom.spdx.json"
      # Docker Hub cannot resolve relative links: point them at the GitHub repository.
      - name: Prepare Docker Hub README
        run: |
          sed -E \
            -e "s|(!\[[^]]*\])\(([^):#][^):]*)\)|\1(https://raw.githubusercontent.com/${SOURCE_REPOSITORY}/main/\2)|g" \
            -e "s|\]\(([^):#][^):]*)\)|](https://github.com/${SOURCE_REPOSITORY}/blob/main/\1)|g" \
            README.md > /tmp/README.dockerhub.md
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY }}
          readme-filepath: /tmp/README.dockerhub.md
          short-description: Kill switch and route manager for Cloudflare Tunnels, built for the phone.
